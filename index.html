<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPU Scheduling Simulator - Team Project</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@300;400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c10;
    --bg2: #111318;
    --bg3: #181c24;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --muted: #7a7f8e;
    --accent: #4f8ef7;
    --accent2: #7c4dff;
    --green: #22d3a0;
    --amber: #f5a623;
    --red: #f25c6e;
    --teal: #00bcd4;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Sora', sans-serif;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; min-height: 100vh; }

  .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 28px; display: flex; align-items: center; gap: 14px; }
  .header-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .header p { font-size: 12px; color: var(--muted); }

  .main { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 65px); }

  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; }

  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }

  .algo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .algo-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; cursor: pointer; font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); text-align: center; transition: all 0.18s; }
  .algo-btn:hover { border-color: var(--accent); color: var(--accent); }
  .algo-btn.active { background: rgba(79,142,247,0.12); border-color: var(--accent); color: var(--accent); }

  .field-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field-row label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .field-row input, .field-row select { background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; padding: 8px 11px; color: var(--text); font-family: var(--mono); font-size: 13px; outline: none; width: 100%; transition: border-color 0.15s; }
  .field-row input:focus, .field-row select:focus { border-color: var(--accent); }

  .process-row { display: grid; grid-template-columns: 48px 1fr 1fr 1fr 28px; gap: 5px; align-items: center; margin-bottom: 6px; }
  .process-row span { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; }
  .process-row input { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; color: var(--text); font-family: var(--mono); font-size: 12px; outline: none; width: 100%; text-align: center; transition: border-color 0.15s; }
  .process-row input:focus { border-color: var(--accent); }
  .process-row .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px; border-radius: 4px; transition: color 0.15s; }
  .process-row .del-btn:hover { color: var(--red); }

  .col-header { display: grid; grid-template-columns: 48px 1fr 1fr 1fr 28px; gap: 5px; margin-bottom: 4px; }
  .col-header span { font-size: 10px; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }

  .btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.18s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3a7ee8; }
  .btn-secondary { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); margin-top: 6px; }
  .btn-secondary:hover { border-color: var(--border2); color: var(--text); }
  .btn-add { background: none; border: 1px dashed var(--border2); color: var(--muted); padding: 7px; border-radius: 7px; cursor: pointer; font-size: 12px; font-family: var(--sans); width: 100%; margin-bottom: 8px; transition: all 0.15s; }
  .btn-add:hover { border-color: var(--accent); color: var(--accent); }

  .content { background: var(--bg); padding: 24px 28px; overflow-y: auto; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 400px; gap: 12px; color: var(--muted); text-align: center; }
  .empty-state .icon { font-size: 48px; opacity: 0.3; }
  .empty-state h2 { font-size: 18px; font-weight: 600; color: var(--text); opacity: 0.4; }
  .empty-state p { font-size: 13px; max-width: 300px; }

  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .results-header h2 { font-size: 20px; font-weight: 700; }
  .algo-badge { background: rgba(79,142,247,0.15); border: 1px solid rgba(79,142,247,0.3); color: var(--accent); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }

  .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .metric-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .metric-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 6px; }
  .metric-card .value { font-size: 26px; font-family: var(--mono); font-weight: 700; }
  .metric-card .value.green { color: var(--green); }
  .metric-card .value.amber { color: var(--amber); }
  .metric-card .value.blue { color: var(--accent); }

  .section-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
  .section-box h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 14px; }

  .gantt-wrap { overflow-x: auto; padding-bottom: 6px; }
  .gantt-container { display: flex; flex-direction: column; gap: 8px; min-width: fit-content; }
  .gantt-row { display: flex; align-items: center; gap: 8px; }
  .gantt-pid { font-family: var(--mono); font-size: 11px; font-weight: 700; width: 30px; color: var(--muted); flex-shrink: 0; }
  .gantt-bars { display: flex; position: relative; }
  .gantt-bar { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; font-weight: 700; border-radius: 4px; height: 26px; position: relative; transition: opacity 0.15s; cursor: default; white-space: nowrap; }
  .gantt-bar:hover { opacity: 0.85; }
  .gantt-idle { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); }
  .gantt-timeline { display: flex; margin-left: 38px; border-top: 1px solid var(--border); padding-top: 4px; }
  .gantt-tick { font-family: var(--mono); font-size: 9px; color: var(--muted); text-align: left; }

  .results-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .results-table th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
  .results-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-family: var(--mono); }
  .results-table tr:last-child td { border-bottom: none; }
  .results-table .avg-row td { color: var(--amber); font-weight: 700; border-top: 1px solid var(--border2); border-bottom: none; }
  .results-table .pid-col { color: var(--accent); font-weight: 700; font-family: var(--mono); }

  .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .compare-table th { padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); text-align: center; }
  .compare-table th:first-child { text-align: left; }
  .compare-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-family: var(--mono); text-align: center; }
  .compare-table td:first-child { text-align: left; color: var(--accent); font-weight: 700; }
  .compare-table tr:last-child td { border-bottom: none; }
  .best { color: var(--green); font-weight: 700; }

  .info-chip { display: inline-flex; align-items: center; gap: 5px; background: rgba(124,77,255,0.1); border: 1px solid rgba(124,77,255,0.25); color: #a78bfa; font-size: 11px; font-family: var(--mono); padding: 3px 9px; border-radius: 20px; }

  .quantum-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .quantum-row > div { flex: 1; }

  .scrollbar-thin::-webkit-scrollbar { height: 4px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: var(--bg3); border-radius: 2px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">⚙</div>
  <div>
    <h1>CPU Scheduling Simulator</h1>
    <p>OS Project — FCFS · SJF · SRT · RR · MLFQ</p>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div>
      <div class="section-label">Algorithm</div>
      <div class="algo-grid">
        <button class="algo-btn active" onclick="selectAlgo('FCFS')">FCFS</button>
        <button class="algo-btn" onclick="selectAlgo('SJF')">SJF</button>
        <button class="algo-btn" onclick="selectAlgo('SRT')">SRT</button>
        <button class="algo-btn" onclick="selectAlgo('RR')">Round Robin</button>
        <button class="algo-btn" onclick="selectAlgo('MLFQ')" style="grid-column: span 2;">MLFQ</button>
      </div>
    </div>

    <div id="quantum-cfg" style="display:none;">
      <div class="section-label">Configuration</div>
      <div id="rr-cfg" style="display:none;">
        <div class="field-row">
          <label>Time Quantum (RR)</label>
          <input type="number" id="quantum-rr" value="2" min="1">
        </div>
      </div>
      <div id="mlfq-cfg" style="display:none;">
        <div class="quantum-row">
          <div class="field-row"><label>Q0 Quantum</label><input type="number" id="q0" value="2" min="1"></div>
          <div class="field-row"><label>Q1 Quantum</label><input type="number" id="q1" value="4" min="1"></div>
        </div>
        <div class="field-row">
            <label>Aging Time (Ticks)</label>
            <input type="number" id="aging-time" value="10" min="1">
        </div>
        <div class="field-row"><label>Q2</label><input type="text" value="FCFS (∞)" disabled style="opacity:0.5;"></div>
      </div>
    </div>

    <div>
      <div class="section-label">Processes</div>
      <div class="col-header">
        <span></span>
        <span>Arrival</span>
        <span>Burst</span>
        <span>Priority</span>
        <span></span>
      </div>
      <div id="process-list"></div>
      <button class="btn-add" onclick="addProcess()">+ Add Process</button>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 0;">
      <button class="btn btn-primary" onclick="runSimulation()">▶ Run Simulation</button>
      <button class="btn btn-secondary" onclick="loadSample()">Load Sample Scenario</button>
      <button class="btn btn-secondary" onclick="runAll()">Compare All Algorithms</button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="empty-state">
      <div class="icon">🖥</div>
      <h2>No simulation running</h2>
      <p>Add processes in the sidebar and click Run Simulation, or load the sample scenario to get started.</p>
    </div>
  </div>
</div>

<script>
let processes = [];
let nextPid = 1;
let selectedAlgo = 'FCFS';
const COLORS = ['#4f8ef7','#22d3a0','#f5a623','#f25c6e','#7c4dff','#00bcd4','#e879f9','#a3e635','#fb923c','#38bdf8'];

function selectAlgo(a) {
  selectedAlgo = a;
  document.querySelectorAll('.algo-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().startsWith(a) || (a === 'RR' && b.textContent.includes('Round')) || (a === 'MLFQ' && b.textContent === 'MLFQ'));
  });
  const qcfg = document.getElementById('quantum-cfg');
  const rrcfg = document.getElementById('rr-cfg');
  const mlfqcfg = document.getElementById('mlfq-cfg');
  qcfg.style.display = (a === 'RR' || a === 'MLFQ') ? 'block' : 'none';
  rrcfg.style.display = a === 'RR' ? 'block' : 'none';
  mlfqcfg.style.display = a === 'MLFQ' ? 'block' : 'none';
}

function addProcess(arrival=0, burst=4, priority=1) {
  const id = nextPid++;
  processes.push({ id, arrival, burst, priority });
  renderProcessList();
}

function removeProcess(id) {
  processes = processes.filter(p => p.id !== id);
  renderProcessList();
}

function renderProcessList() {
  const list = document.getElementById('process-list');
  list.innerHTML = '';
  processes.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'process-row';
    row.innerHTML = `
      <span>P${p.id}</span>
      <input type="number" value="${p.arrival}" min="0" onchange="processes[${i}].arrival=+this.value" placeholder="0">
      <input type="number" value="${p.burst}" min="1" onchange="processes[${i}].burst=+this.value" placeholder="4">
      <input type="number" value="${p.priority}" min="1" onchange="processes[${i}].priority=+this.value" placeholder="1">
      <button class="del-btn" onclick="removeProcess(${p.id})">×</button>`;
    list.appendChild(row);
  });
}

function loadSample() {
  processes = [];
  nextPid = 1;
  // Processes: P1:0/5, P2:1/3, P3:2/8, P4:3/6
  [[0,5,1],[1,3,1],[2,8,1],[3,6,1]].forEach(([a,b,pr]) => {
    processes.push({ id: nextPid++, arrival: a, burst: b, priority: pr });
  });
  renderProcessList();
}

// ─── Algorithms ───────────────────────────────────────────
function fcfs(procs) {
  const ps = procs.map(p => ({...p, remaining: p.burst})).sort((a,b) => a.arrival - b.arrival || a.id - b.id);
  const timeline = []; let t = 0;
  ps.forEach(p => {
    if (t < p.arrival) { timeline.push({pid:'idle', start: t, end: p.arrival}); t = p.arrival; }
    if (p.start === undefined) p.start = t;
    timeline.push({pid: p.id, start: t, end: t + p.burst});
    p.finish = t + p.burst; t += p.burst;
  });
  return { timeline, ps };
}

function sjf(procs) {
  const ps = procs.map(p => ({...p, remaining: p.burst, done: false, start: -1, finish: 0}));
  const timeline = []; let t = 0; let done = 0;
  while (done < ps.length) {
    const avail = ps.filter(p => !p.done && p.arrival <= t);
    if (!avail.length) {
      const next = ps.filter(p => !p.done).sort((a,b) => a.arrival - b.arrival)[0];
      timeline.push({pid:'idle', start: t, end: next.arrival}); t = next.arrival; continue;
    }
    const p = avail.sort((a,b) => a.burst - b.burst || a.arrival - b.arrival)[0];
    if (p.start === -1) p.start = t;
    timeline.push({pid: p.id, start: t, end: t + p.burst});
    t += p.burst; p.finish = t; p.done = true; done++;
  }
  return { timeline, ps };
}

function srt(procs) {
  const ps = procs.map(p => ({...p, remaining: p.burst, done: false, start: -1, finish: 0}));
  const timeline = []; let t = 0; let done = 0; let last = null;
  while (done < ps.length) {
    const avail = ps.filter(p => !p.done && p.arrival <= t);
    if (!avail.length) {
      const next = ps.filter(p => !p.done).sort((a,b) => a.arrival - b.arrival)[0];
      timeline.push({pid:'idle', start: t, end: next.arrival}); t = next.arrival; last = null; continue;
    }
    const p = avail.sort((a,b) => a.remaining - b.remaining || a.arrival - b.arrival)[0];
    if (p.start === -1) p.start = t;
    if (last !== p.id) { timeline.push({pid: p.id, start: t, end: t}); last = p.id; }
    timeline[timeline.length-1].end = t + 1;
    p.remaining--; t++;
    if (p.remaining === 0) { p.finish = t; p.done = true; done++; last = null; }
  }
  mergeTl(timeline);
  return { timeline, ps };
}

function rr(procs, quantum) {
  const ps = procs.map(p => ({...p, remaining: p.burst, done: false, start: -1, finish: 0}));
  const timeline = []; let t = 0; let done = 0;
  const queue = []; const entered = new Set();
  const add = () => ps.filter(p => !p.done && !entered.has(p.id) && p.arrival <= t)
    .sort((a,b)=>a.arrival-b.arrival).forEach(p => { queue.push(p); entered.add(p.id); });
  add();
  while (done < ps.length) {
    if (!queue.length) {
      const next = ps.filter(p => !p.done).sort((a,b)=>a.arrival-b.arrival)[0];
      timeline.push({pid:'idle',start:t,end:next.arrival}); t=next.arrival; add(); continue;
    }
    const p = queue.shift();
    if (p.start===-1) p.start=t;
    const run = Math.min(quantum, p.remaining);
    timeline.push({pid:p.id,start:t,end:t+run});
    t+=run; p.remaining-=run;
    add();
    if (p.remaining===0) { p.finish=t; p.done=true; done++; }
    else { ps.filter(pp=>!pp.done&&!entered.has(pp.id)&&pp.arrival<=t).sort((a,b)=>a.arrival-b.arrival).forEach(pp=>{queue.push(pp);entered.add(pp.id);}); queue.push(p); }
  }
  return { timeline, ps };
}

function mlfq(procs, q0, q1, agingTime) {
  const ps = procs.map(p => ({...p, remaining: p.burst, done: false, start: -1, finish: 0, queue: 0, lastWaitUpdate: p.arrival}));
  const timeline = []; let t = 0; let done = 0;
  const Q = [[],[],[]]; const entered = new Set();
  
  const enqueueNew = () => {
    ps.filter(p => !p.done && !entered.has(p.id) && p.arrival <= t)
      .sort((a,b)=>a.arrival-b.arrival)
      .forEach(p => { Q[0].push(p); entered.add(p.id); });
  };

  const applyAging = () => {
    [1, 2].forEach(qi => {
        for (let i = Q[qi].length - 1; i >= 0; i--) {
            const p = Q[qi][i];
            if (t - p.lastWaitUpdate >= agingTime) {
                p.queue = Math.max(0, qi - 1);
                p.lastWaitUpdate = t;
                Q[p.queue].push(Q[qi].splice(i, 1)[0]);
            }
        }
    });
  };

  enqueueNew();
  while (done < ps.length) {
    applyAging();
    let ran = false;
    for (let qi = 0; qi < 3; qi++) {
      if (!Q[qi].length) continue;
      const p = Q[qi].shift();
      if (p.start === -1) p.start = t;
      p.lastWaitUpdate = t; // Reset wait timer on service
      const quantum = qi === 0 ? q0 : qi === 1 ? q1 : Infinity;
      const run = Math.min(quantum, p.remaining);
      timeline.push({pid: p.id, start: t, end: t + run});
      t += run; p.remaining -= run;
      enqueueNew();
      if (p.remaining === 0) { p.finish = t; p.done = true; done++; }
      else { p.queue = Math.min(2, qi + 1); Q[p.queue].push(p); }
      ran = true; break;
    }
    if (!ran) {
      const next = ps.filter(p => !p.done).sort((a,b)=>a.arrival-b.arrival)[0];
      if(next){timeline.push({pid:'idle',start:t,end:next.arrival});t=next.arrival;enqueueNew();}
    }
  }
  return { timeline, ps };
}

function mergeTl(tl) {
  for (let i = tl.length-1; i>0; i--) {
    if (tl[i].pid===tl[i-1].pid) { tl[i-1].end=tl[i].end; tl.splice(i,1); }
  }
}

function metrics(ps) {
  return ps.map(p => ({
    id: p.id,
    wt: p.finish - p.arrival - p.burst,
    tat: p.finish - p.arrival,
    rt: p.start - p.arrival
  }));
}

// ─── UI ───────────────────────────────────────────────────────
function renderResults(algo, timeline, ps, config='') {
  const m = metrics(ps);
  const avgWT = m.reduce((s,p)=>s+p.wt,0)/m.length;
  const avgTAT = m.reduce((s,p)=>s+p.tat,0)/m.length;
  const avgRT = m.reduce((s,p)=>s+p.rt,0)/m.length;
  const SCALE = 28;
  const maxT = Math.max(...timeline.map(s=>s.end));

  const ganttBars = timeline.map(s => {
    const w = Math.max((s.end - s.start) * SCALE, 20);
    if (s.pid === 'idle') return `<div class="gantt-bar gantt-idle" style="width:${w}px;">idle</div>`;
    const ci = (s.pid - 1) % COLORS.length;
    const col = COLORS[ci];
    return `<div class="gantt-bar" style="width:${w}px;background:${col}22;border:1px solid ${col}55;color:${col};padding:0 4px;">P${s.pid}</div>`;
  }).join('');

  const uniqueTicks = [...new Set(timeline.flatMap(s => [s.start, s.end]))].sort((a,b)=>a-b);
  const tickHtml = uniqueTicks.map((t,i) => {
    const left = t * SCALE;
    const nextLeft = i < uniqueTicks.length-1 ? uniqueTicks[i+1]*SCALE : left;
    return `<div class="gantt-tick" style="width:${nextLeft-left}px;">${t}</div>`;
  }).join('');

  const tableRows = ps.sort((a,b)=>a.id-b.id).map(p => {
    const mp = m.find(x=>x.id===p.id);
    return `<tr><td class="pid-col">P${p.id}</td><td>${p.arrival}</td><td>${p.burst}</td><td>${p.start}</td><td>${p.finish}</td><td>${mp.wt}</td><td>${mp.tat}</td><td>${mp.rt}</td></tr>`;
  }).join('');

  return `
    <div class="results-header"><h2>${algoName(algo)}</h2>${config ? `<div style="margin-top:5px;">${config}</div>` : ''}<span class="algo-badge">${algo}</span></div>
    <div class="metrics-grid">
      <div class="metric-card"><div class="label">Avg Waiting Time</div><div class="value green">${avgWT.toFixed(2)}</div></div>
      <div class="metric-card"><div class="label">Avg Turnaround</div><div class="value amber">${avgTAT.toFixed(2)}</div></div>
      <div class="metric-card"><div class="label">Avg Response Time</div><div class="value blue">${avgRT.toFixed(2)}</div></div>
    </div>
    <div class="section-box"><h3>Gantt Chart</h3><div class="gantt-wrap scrollbar-thin"><div class="gantt-container"><div class="gantt-row"><div class="gantt-pid"></div><div class="gantt-bars">${ganttBars}</div></div><div class="gantt-timeline">${tickHtml}</div></div></div></div>
    <div class="section-box"><h3>Process Metrics</h3><table class="results-table"><thead><tr><th>PID</th><th>Arrival</th><th>Burst</th><th>Start</th><th>Finish</th><th>WT</th><th>TAT</th><th>RT</th></tr></thead><tbody>${tableRows}<tr class="avg-row"><td colspan="5">Averages</td><td>${avgWT.toFixed(2)}</td><td>${avgTAT.toFixed(2)}</td><td>${avgRT.toFixed(2)}</td></tr></tbody></table></div>`;
}

function algoName(a) { return {FCFS:'First Come First Serve',SJF:'Shortest Job First',SRT:'Shortest Remaining Time',RR:'Round Robin',MLFQ:'Multilevel Feedback Queue'}[a]||a; }

function runSimulation() {
  if (!processes.length) { alert('Add at least one process.'); return; }
  const qrr = +document.getElementById('quantum-rr')?.value || 2;
  const q0 = +document.getElementById('q0')?.value || 2;
  const q1 = +document.getElementById('q1')?.value || 4;
  const aging = +document.getElementById('aging-time')?.value || 10;
  let res; let config = '';
  if (selectedAlgo === 'FCFS') res = fcfs(processes);
  else if (selectedAlgo === 'SJF') res = sjf(processes);
  else if (selectedAlgo === 'SRT') res = srt(processes);
  else if (selectedAlgo === 'RR') { res = rr(processes, qrr); config = `<span class="info-chip">q=${qrr}</span>`; }
  else { res = mlfq(processes, q0, q1, aging); config = `<span class="info-chip">Q0=${q0} Q1=${q1} Age=${aging}</span>`; }
  document.getElementById('content').innerHTML = renderResults(selectedAlgo, res.timeline, res.ps, config);
}

function runAll() {
  if (!processes.length) { alert('Add at least one process.'); return; }
  const qrr = +document.getElementById('quantum-rr')?.value || 2;
  const q0 = +document.getElementById('q0')?.value || 2;
  const q1 = +document.getElementById('q1')?.value || 4;
  const aging = +document.getElementById('aging-time')?.value || 10;
  const algos = [
    {key:'FCFS', fn: ()=>fcfs(processes), cfg:''},
    {key:'SJF', fn: ()=>sjf(processes), cfg:''},
    {key:'SRT', fn: ()=>srt(processes), cfg:''},
    {key:'RR', fn: ()=>rr(processes, qrr), cfg:`<span class="info-chip">q=${qrr}</span>`},
    {key:'MLFQ', fn: ()=>mlfq(processes, q0, q1, aging), cfg:`<span class="info-chip">Q0=${q0} Q1=${q1} Age=${aging}</span>`},
  ];
  const results = algos.map(a => { const r = a.fn(); const m = metrics(r.ps); return { ...r, key: a.key, cfg: a.cfg, m, avgWT: m.reduce((s,p)=>s+p.wt,0)/m.length, avgTAT: m.reduce((s,p)=>s+p.tat,0)/m.length, avgRT: m.reduce((s,p)=>s+p.rt,0)/m.length }; });
  
  const minWT = Math.min(...results.map(r=>r.avgWT));
  const minTAT = Math.min(...results.map(r=>r.avgTAT));
  const minRT = Math.min(...results.map(r=>r.avgRT));

  const compareRows = results.map(r => `<tr><td>${r.key}</td><td class="${r.avgWT===minWT?'best':''}">${r.avgWT.toFixed(2)}</td><td class="${r.avgTAT===minTAT?'best':''}">${r.avgTAT.toFixed(2)}</td><td class="${r.avgRT===minRT?'best':''}">${r.avgRT.toFixed(2)}</td></tr>`).join('');

  document.getElementById('content').innerHTML = `<div class="results-header"><h2>Comparison Results</h2></div><div class="section-box"><h3>Summary Table</h3><table class="compare-table"><thead><tr><th>Algorithm</th><th>Avg WT</th><th>Avg TAT</th><th>Avg RT</th></tr></thead><tbody>${compareRows}</tbody></table></div>` + results.map(r => renderResults(r.key, r.timeline, r.ps, r.cfg)).join('<hr style="border:0;border-top:1px solid var(--border);margin:30px 0;">');
}

loadSample();
</script>
</body>
</html>
